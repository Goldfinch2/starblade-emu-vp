# Star Blade: its lamp colors and its control guide, for a cabinet with
# LED-lit controls (the cabinet's own leds.cfg wins where it has lines for
# starblade_emu). See the VectorPie SDK's docs/07-packages.md.

starblade_emu/color_map[p1_joystick1] #00C0FF
starblade_emu/color_map[p1_button1]   #FF0000
starblade_emu/color_map[p1_button2]   #FF0000

starblade_emu/voice_map[p1_joystick1] aim
starblade_emu/voice_map[p1_button1]   gun
starblade_emu/voice_map[p1_button2]   gun

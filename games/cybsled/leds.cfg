# Cyber Sled: its lamp colors and its control guide, for a cabinet with
# LED-lit controls (the cabinet's own leds.cfg wins where it has lines for
# cybersled_emu). See the VectorPie SDK's docs/07-packages.md.

cybersled_emu/color_map[p1_joystick1] #00C0FF
cybersled_emu/color_map[p2_joystick1] #00C0FF
cybersled_emu/color_map[p1_button1]   #FF0000
cybersled_emu/color_map[p1_button2]   #FFA000

cybersled_emu/voice_map[p1_joystick1] left_tread
cybersled_emu/voice_map[p2_joystick1] right_tread
cybersled_emu/voice_map[p1_button1]   gun
cybersled_emu/voice_map[p1_button2]   missile
